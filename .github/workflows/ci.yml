name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Assemble and validate the VBA bundle
        run: python assemble.py

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Run isolated hybrid engine tests
        run: powershell -ExecutionPolicy Bypass -File .\scripts\run_hybrid_engine_tests.ps1

      - name: Confirm generated bundles are current
        run: git diff --exit-code -- VBA_Cleanup_tool.txt "Practice - Try CleanupSuite Here/VBA_Cleanup_tool.txt"
